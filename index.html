<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Employee Management System</h1>

    <form id="employeeForm">
        <input id="name" placeholder="Employee Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="department" placeholder="Department" required>
        <button type="submit">Add Employee</button>
    </form>

    <h2>Employees</h2>
    <button onclick="loadEmployees()">Refresh</button>
    <table>
        <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Action</th></tr>
        </thead>
        <tbody id="employees"></tbody>
    </table>
</div>
<script src="app.js"></script>
</body>
</html>
